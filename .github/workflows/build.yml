name: Build VHCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with clang (direct)
        run: |
          # Find iOS SDK
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          # Find clang
          CC=$(xcrun --sdk iphoneos --find clang)
          echo "CC: $CC"
          
          # Compile
          $CC -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -dynamiclib \
            -install_name @executable_path/VHCheat.dylib \
            -o VHCheat.dylib \
            VHCheat.xm
          
          # Sign with ldid (ad-hoc)
          ldid -S VHCheat.dylib
          
          # Verify
          file VHCheat.dylib
          ls -la VHCheat.dylib
          
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VHCheat.dylib
          path: VHCheat.dylib
