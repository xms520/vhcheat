name: Build VHCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          brew install ldid make xz
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
      - name: Setup iOS SDK
        run: |
          SDK_URL="https://github.com/xybp888/iOS-SDK/releases/download/16.2/iPhoneOS16.2.sdk.tar.xz"
          mkdir -p $HOME/theos/sdk
          curl -L $SDK_URL -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdk/
          ls $HOME/theos/sdk/
          
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make FINALPACKAGE=1
          
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VHCheat.dylib
          path: .theos/obj/debug/arm64/VHCheat.dylib
