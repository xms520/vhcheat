name: Build VHCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          brew install ldid make xz
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # Initialize Theos (creates vendor/include and vendor/lib)
          yes | $HOME/theos/bin/update-theos 2>&1 || true
          ls $HOME/theos/vendor/include/ 2>/dev/null | head -5 || echo "vendor/include missing"
          
      - name: Setup iOS SDK (from Xcode)
        run: |
          # GitHub Actions macOS runner has Xcode with iOS SDK
          SDK_PATH=$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
          if [ -d "$SDK_PATH" ]; then
            mkdir -p $HOME/theos/sdk
            # Create a tar.xz from the Xcode SDK
            cd $(dirname "$SDK_PATH")
            tar -cf - $(basename "$SDK_PATH") | xz -9 -c > /tmp/iPhoneOS.sdk.tar.xz
            tar -xf /tmp/iPhoneOS.sdk.tar.xz -C $HOME/theos/sdk/
            ls $HOME/theos/sdk/iPhoneOS.sdk/System/Library/Frameworks/ | head -5
          else
            echo "SDK not found at $SDK_PATH, trying xcrun..."
            SDK_PATH2=$(xcrun --sdk iphoneos --show-sdk-path)
            echo "SDK path: $SDK_PATH2"
            mkdir -p $HOME/theos/sdk
            cd $(dirname "$SDK_PATH2")
            tar -cf - $(basename "$SDK_PATH2") | xz -9 -c > /tmp/iPhoneOS.sdk.tar.xz
            tar -xf /tmp/iPhoneOS.sdk.tar.xz -C $HOME/theos/sdk/
          fi
          
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make FINALPACKAGE=1
          
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VHCheat.dylib
          path: .theos/obj/debug/arm64/VHCheat.dylib
