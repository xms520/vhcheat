name: Build VHCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          echo "SDK: $SDK"
          echo "CC: $CC"
          
          # Rename .xm to .m (no Logos used, plain ObjC)
          cp VHCheat.xm VHCheat.m
          
          $CC -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -dynamiclib \
            -install_name @executable_path/VHCheat.dylib \
            -o VHCheat.dylib \
            VHCheat.m
          
          # Sign
          ldid -S VHCheat.dylib
          
          file VHCheat.dylib
          ls -la VHCheat.dylib
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VHCheat.dylib
          path: VHCheat.dylib
