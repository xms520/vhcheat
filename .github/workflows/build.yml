name: Build VHCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          echo "SDK: $SDK"
          echo "CC: $CC"
          
          cp VHCheat8.xm VHCheat8.m
          
          $CC -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -dynamiclib \
            -install_name @executable_path/VHCheat8.dylib \
            -o VHCheat8.dylib \
            VHCheat8.m
          
          brew install ldid
          ldid -S VHCheat8.dylib
          
          file VHCheat8.dylib
          ls -la VHCheat8.dylib
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VHCheat8.dylib
          path: VHCheat8.dylib
